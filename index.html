<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Hell: Complete Editions</title>
    <style>
        body {
            background-color: #05050a;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #hud {
            width: 500px;
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            margin-bottom: 5px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        canvas {
            background: #000;
            border: 3px solid #ff0055;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.4);
        }
        #menu-overlay {
            display: flex;
            position: absolute;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5, 5, 10, 0.95);
            width: 500px;
            height: 500px;
            border: 3px solid #ff0055;
            box-sizing: border-box;
            padding: 20px;
            text-align: center;
        }
        h2 {
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px #ff0055;
        }
        p {
            margin: 0 0 20px 0;
            color: #ccc;
            line-height: 1.4;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 220px;
        }
        button {
            color: white;
            border: none;
            padding: 10px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-easy { background: #4caf50; box-shadow: 0 0 10px rgba(76, 175, 80, 0.4); }
        .btn-medium { background: #2196f3; box-shadow: 0 0 10px rgba(33, 150, 243, 0.4); }
        .btn-hard { background: #ffaa00; box-shadow: 0 0 10px rgba(255, 170, 0, 0.4); }
        .btn-brutal { background: #ff0055; box-shadow: 0 0 10px rgba(255, 0, 85, 0.4); }
        .btn-impossible { background: #9900ff; box-shadow: 0 0 10px rgba(153, 0, 255, 0.4); }
        button:hover { filter: brightness(1.2); }
    </style>
</head>
<body>

    <div id="hud">
        <div>SCORE: <span id="score">0</span></div>
        <div id="difficulty-display" style="color: #ff0055;">DIFFICULTY: -</div>
    </div>

    <div style="position: relative;">
        <canvas id="gameCanvas" width="500" height="500"></canvas>
        <div id="menu-overlay">
            <h2 id="menu-title">SELECT DIFFICULTY</h2>
            <p id="menu-desc">Choose your gameplay speed parameters:</p>
            <div class="btn-group" id="button-container">
                <!-- Buttons dynamically loaded -->
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("score");
        const diffDisplay = document.getElementById("difficulty-display");
        const menuOverlay = document.getElementById("menu-overlay");
        const menuTitle = document.getElementById("menu-title");
        const menuDesc = document.getElementById("menu-desc");
        const btnContainer = document.getElementById("button-container");

        // Calibration matrices for balancing
        const CONFIGS = {
            EASY: { label: "EASY", rows: 2, speedX: 1.2, speedY: 15, fireChance: 0.005, bulletSpeed: 3.0, color: "#4caf50" },
            MEDIUM: { label: "MEDIUM", rows: 3, speedX: 1.8, speedY: 18, fireChance: 0.010, bulletSpeed: 4.0, color: "#2196f3" },
            HARD: { label: "HARD", rows: 3, speedX: 2.3, speedY: 20, fireChance: 0.018, bulletSpeed: 5.0, color: "#ffaa00" },
            BRUTAL: { label: "BRUTAL", rows: 4, speedX: 2.8, speedY: 25, fireChance: 0.028, bulletSpeed: 6.5, color: "#ff0055" },
            IMPOSSIBLE: { label: "IMPOSSIBLE", rows: 5, speedX: 3.6, speedY: 30, fireChance: 0.050, bulletSpeed: 9.0, color: "#9900ff" }
        };

        let currentDiff = CONFIGS.MEDIUM;
        let player, playerBullets, enemyBullets, enemies, keys;
        let score, isPlaying, enemySpeedX, enemyDirection, startTime;

        const PLAYER_SPEED = 6;
        const BULLET_SPEED = -9;

        window.addEventListener("keydown", e => keys[e.key] = true);
        window.addEventListener("keyup", e => keys[e.key] = false);

        function showSelectionMenu(titleText, descText) {
            isPlaying = false;
            menuTitle.textContent = titleText;
            menuDesc.textContent = descText;
            
            btnContainer.innerHTML = `
                <button class="btn-easy" onclick="startGame('EASY')">EASY</button>
                <button class="btn-medium" onclick="startGame('MEDIUM')">MEDIUM</button>
                <button class="btn-hard" onclick="startGame('HARD')">HARD</button>
                <button class="btn-brutal" onclick="startGame('BRUTAL')">BRUTAL</button>
                <button class="btn-impossible" onclick="startGame('IMPOSSIBLE')">IMPOSSIBLE</button>
            `;
            menuOverlay.style.display = "flex";
        }

        function startGame(diffKey) {
            currentDiff = CONFIGS[diffKey];
            menuOverlay.style.display = "none";
            
            diffDisplay.textContent = `DIFFICULTY: ${currentDiff.label}`;
            diffDisplay.style.color = currentDiff.color;
            
            initGame();
            isPlaying = true;
            startTime = Date.now();
            requestAnimationFrame(gameLoop);
        }

        function initGame() {
            player = { x: canvas.width / 2 - 15, y: canvas.height - 40, w: 30, h: 20 };
            playerBullets = [];
            enemyBullets = [];
            enemies = [];
            keys = {};
            score = 0;
            enemySpeedX = currentDiff.speedX;
            enemyDirection = 1;
            scoreDisplay.textContent = score;

            const cols = 7;
            for (let r = 0; r < currentDiff.rows; r++) {
                for (let c = 0; c < cols; c++) {
                    enemies.push({
                        x: 40 + c * 60,
                        y: 40 + r * 45,
                        w: 35,
                        h: 25,
                        color: currentDiff.color
                    });
                }
            }
        }

        function gameLoop() {
            if (!isPlaying) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Player Navigation Execution
            if ((keys["ArrowLeft"] || keys["a"]) && player.x > 0) player.x -= PLAYER_SPEED;
            if ((keys["ArrowRight"] || keys["d"]) && player.x < canvas.width - player.w) player.x += PLAYER_SPEED;

            // 2. Weapons Systems Processing
            if (keys[" "] || keys["w"] || keys["ArrowUp"]) {
                if (playerBullets.length === 0 || playerBullets[playerBullets.length - 1].y < player.y - 100) {
                    playerBullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 12 });
                }
            }

            // 3. User Bullet Track Vectors
            ctx.fillStyle = "#00ffff";
            for (let i = playerBullets.length - 1; i >= 0; i--) {
                let b = playerBullets[i];
                b.y += BULLET_SPEED;
                ctx.fillRect(b.x, b.y, b.w, b.h);

                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
                        enemies.splice(j, 1);
                        playerBullets.splice(i, 1);
                        score += 100;
                        scoreDisplay.textContent = score;
                        enemySpeedX += 0.15; // Dynamic escalation
                        break;
                    }
                }
                if (b && b.y < 0) playerBullets.splice(i, 1);
            }

            // 4. Invader Structural Loops
            let shiftDown = false;
            enemies.forEach(e => {
                e.x += enemySpeedX * enemyDirection;
                if (e.x + e.w > canvas.width || e.x < 0) shiftDown = true;
            });

            if (shiftDown) {
                enemyDirection *= -1;
                enemies.forEach(e => {
                    e.y += currentDiff.speedY;
                    if (e.y + e.h >= player.y) endGame(false);
                });
            }

            enemies.forEach(e => {
                ctx.fillStyle = e.color;
                ctx.fillRect(e.x, e.y, e.w, e.h);
                
                if (Math.random() < currentDiff.fireChance) {
                    enemyBullets.push({ x: e.x + e.w / 2 - 2, y: e.y + e.h, w: 5, h: 10 });
                }
            });

            // 5. Hostile Artillery Resolution
            ctx.fillStyle = "#ffffff";
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                let eb = enemyBullets[i];
                eb.y += currentDiff.bulletSpeed;
                ctx.fillRect(eb.x, eb.y, eb.w, eb.h);

                if (eb.x < player.x + player.w && eb.x + eb.w > player.x &&
                    eb.y < player.y + player.h && eb.y + eb.h > player.y) {
                    endGame(false);
                    return;
                }
                if (eb.y > canvas.height) enemyBullets.splice(i, 1);
            }

            // 6. Graphics Render
