<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake Game</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-shadow: 0 0 10px #4caf50;
        }

        #score-board {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        canvas {
            background-color: #000000;
            border: 4px solid #4caf50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }

        #game-over-screen {
            display: none;
            position: absolute;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ff5722;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        #game-over-screen h2 {
            color: #ff5722;
            font-size: 3rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px #ff5722;
        }

        button {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.2rem;
            font-family: inherit;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.2s;
            margin-top: 15px;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>SNAKE</h1>
    <div id="score-board">Score: <span id="score">0</span></div>

    <div style="position: relative;">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div id="game-over-screen">
            <h2>GAME OVER</h2>
            <p>Final Score: <span id="final-score">0</span></p>
            <button onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const gameOverScreen = document.getElementById("game-over-screen");
        const finalScoreElement = document.getElementById("final-score");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = gridSize;
        let dy = 0;
        let score = 0;
        let gameInterval;
        let gameSpeed = 100; // Lower is faster (milliseconds)
        let changingDirection = false;

        // Start the game loop
        resetGame();

        function resetGame() {
            snake = [
                { x: gridSize * 5, y: gridSize * 5 },
                { x: gridSize * 4, y: gridSize * 5 },
                { x: gridSize * 3, y: gridSize * 5 }
            ];
            dx = gridSize;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            gameOverScreen.style.display = "none";
            
            generateFood();
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, gameSpeed);
        }

        function gameLoop() {
            if (checkGameOver()) {
                gameOverScreen.style.display = "flex";
                finalScoreElement.innerText = score;
                clearInterval(gameInterval);
                return;
            }

            changingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                // Head is brighter green, body is standard green
                ctx.fillStyle = index === 0 ? "#8bc34a" : "#4caf50";
                ctx.strokeStyle = "#000000";
                
                ctx.fillRect(part.x, part.y, gridSize, gridSize);
                ctx.strokeRect(part.x, part.y, gridSize, gridSize);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            // Check if snake ate the food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                generateFood();
            } else {
                // Remove the tail if it didn't eat food
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount) * gridSize;
            food.y = Math.floor(Math.random() * tileCount) * gridSize;

            // Ensure food doesn't spawn on top of the snake
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    generateFood();
                }
            });
        }

        function drawFood() {
            ctx.fillStyle = "#ff5722";
            ctx.fillRect(food.x, food.y, gridSize, gridSize);
        }

        function checkGameOver() {
            const head = snake[0];

            // Wall collisions
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                return true;
            }

            // Self collisions (skip index 0 check against itself)
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            return false;
        }

        // Handle Arrow Key Controls
        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            const keyPressed = event.keyCode;
            
            // Prevent 180 degree turns (backtracking into yourself)
            const goingUp = dy === -gridSize;
            const goingDown = dy === gridSize;
            const goingRight = dx === gridSize;
            const goingLeft = dx === -gridSize;

            if (changingDirection) return;

            if (keyPressed === 37 && !goingRight) { // Left arrow
                dx = -gridSize;
                dy = 0;
                changingDirection = true;
            }
            if (keyPressed === 38 && !goingDown) { // Up arrow
                dx = 0;
                dy = -gridSize;
                changingDirection = true;
            }
            if (keyPressed === 39 && !goingLeft) { // Right arrow
                dx = gridSize;
                dy = 0;
                changingDirection = true;
            }
            if (keyPressed === 40 && !goingUp) { // Down arrow
                dx = 0;
                dy = gridSize;
                changingDirection = true;
            }
        }
    </script>
</body>
</html>
