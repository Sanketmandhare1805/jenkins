<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Hell: Hard Mode</title>
    <style>
        body {
            background-color: #05050a;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #hud {
            width: 500px;
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            margin-bottom: 5px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        canvas {
            background: #000;
            border: 3px solid #ff0055;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.4);
        }
        #menu-overlay {
            display: none;
            position: absolute;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5, 5, 10, 0.9);
            width: 500px;
            height: 500px;
            border: 3px solid #ff0055;
            box-sizing: border-box;
        }
        h2 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px #ff0055;
        }
        button {
            background: #ff0055;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1.1rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
        }
        button:hover {
            background: #ff3377;
        }
    </style>
</head>
<body>

    <div id="hud">
        <div>SCORE: <span id="score">0</span></div>
        <div style="color: #ff0055;">DIFFICULTY: BRUTAL</div>
    </div>

    <div style="position: relative;">
        <canvas id="gameCanvas" width="500" height="500"></canvas>
        <div id="menu-overlay">
            <h2 id="menu-title">GAME OVER</h2>
            <p id="menu-desc">You lasted 0 seconds.</p>
            <button onclick="startGame()">TRY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("score");
        const menuOverlay = document.getElementById("menu-overlay");
        const menuTitle = document.getElementById("menu-title");
        const menuDesc = document.getElementById("menu-desc");

        // Game state
        let player, playerBullets, enemyBullets, enemies, keys;
        let score, isPlaying, enemySpeedX, enemyDirection, lastTime, startTime;

        // Configuration
        const PLAYER_SPEED = 6;
        const BULLET_SPEED = -8;
        const ENEMY_BULLET_SPEED = 5;
        const ENEMY_FIRE_CHANCE = 0.02; // Very high fire rate trigger

        function init() {
            player = { x: canvas.width / 2 - 15, y: canvas.height - 40, w: 30, h: 20 };
            playerBullets = [];
            enemyBullets = [];
            enemies = [];
            keys = {};
            score = 0;
            enemySpeedX = 2.5; 
            enemyDirection = 1;
            scoreDisplay.textContent = score;

            // Spawn grid of brutal enemies
            const rows = 4;
            const cols = 7;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    enemies.push({
                        x: 40 + c * 60,
                        y: 40 + r * 45,
                        w: 35,
                        h: 25,
                        color: r % 2 === 0 ? "#ff0055" : "#ff5500"
                    });
                }
            }
        }

        window.addEventListener("keydown", e => keys[e.key] = true);
        window.addEventListener("keyup", e => keys[e.key] = false);

        function startGame() {
            menuOverlay.style.display = "none";
            init();
            isPlaying = true;
            startTime = Date.now();
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function gameLoop(timestamp) {
            if (!isPlaying) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Move Player
            if ((keys["ArrowLeft"] || keys["a"]) && player.x > 0) player.x -= PLAYER_SPEED;
            if ((keys["ArrowRight"] || keys["d"]) && player.x < canvas.width - player.w) player.x += PLAYER_SPEED;

            // 2. Shoot (Spacebar or W / Up Arrow)
            if (keys[" "] || keys["w"] || keys["ArrowUp"]) {
                if (playerBullets.length === 0 || playerBullets[playerBullets.length - 1].y < player.y - 120) {
                    playerBullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 12 });
                }
            }

            // 3. Update & Draw Player Bullets
            ctx.fillStyle = "#00ffff";
            for (let i = playerBullets.length - 1; i >= 0; i--) {
                let b = playerBullets[i];
                b.y += BULLET_SPEED;
                ctx.fillRect(b.x, b.y, b.w, b.h);

                // Check hit on enemies
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
                        enemies.splice(j, 1);
                        playerBullets.splice(i, 1);
                        score += 150;
                        scoreDisplay.textContent = score;
                        enemySpeedX += 0.15; // Speed ramps up significantly as they die
                        break;
                    }
                }
                if (b && b.y < 0) playerBullets.splice(i, 1);
            }

            // 4. Update & Draw Enemies
            let shiftDown = false;
            enemies.forEach(e => {
                e.x += enemySpeedX * enemyDirection;
                if (e.x + e.w > canvas.width || e.x < 0) shiftDown = true;
            });

            if (shiftDown) {
                enemyDirection *= -1;
                enemies.forEach(e => {
                    e.y += 25; // Massive downward jump
                    if (e.y + e.h >= player.y) endGame(false); // Infiltration loss
                });
            }

            enemies.forEach(e => {
                ctx.fillStyle = e.color;
                ctx.fillRect(e.x, e.y, e.w, e.h);
                
                // Aggressive firing AI
                if (Math.random() < ENEMY_FIRE_CHANCE) {
                    enemyBullets.push({ x: e.x + e.w / 2 - 2, y: e.y + e.h, w: 5, h: 10 });
                }
            });

            // 5. Update & Draw Enemy Bullets (Bullet Hell Tracker)
            ctx.fillStyle = "#ff0055";
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                let eb = enemyBullets[i];
                eb.y += ENEMY_BULLET_SPEED;
                ctx.fillRect(eb.x, eb.y, eb.w, eb.h);

                // Collision with player (Instadeath)
                if (eb.x < player.x + player.w && eb.x + eb.w > player.x &&
                    eb.y < player.y + player.h && eb.y + eb.h > player.y) {
                    endGame(false);
                    return;
                }
                if (eb.y > canvas.height) enemyBullets.splice(i, 1);
            }

            // 6. Draw Player
            ctx.fillStyle = "#fff";
            ctx.fillRect(player.x, player.y, player.w, player.h);

            // Win state check
            if (enemies.length === 0) {
                endGame(true);
                return;
            }

            requestAnimationFrame(gameLoop);
        }

        function endGame(victory) {
            isPlaying = false;
            const duration = ((Date.now() - startTime) / 1000).toFixed(1);
            menuTitle.textContent = victory ? "VICTORY!" : "DESTROYED";
            menuTitle.style.color = victory ? "#00ffff" : "#ff0055";
            menuDesc.textContent = victory 
                ? `Incredible. Cleared in ${duration}s with score: ${score}`
                : `Survival time: ${duration} seconds. Score: ${score}`;
            menuOverlay.style.display = "flex";
        }

        // Show welcome overlay initially
        menuTitle.textContent = "SPACE HELL";
        menuTitle.style.color = "#ff0055";
        menuDesc.textContent = "Controls: A/D or Arrows to move. Space to fire. One hit, you die.";
        menuOverlay.style.display = "flex";
    </script>
</body>
</html>
